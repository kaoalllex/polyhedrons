<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dialogue</title>
<style>
:root{--bg:#f4f5f8;--panel:#fbfbfd;--line:#d9dde5;--text:#202530;--muted:#5d6574;--accent:#2f62d9;--danger:#b42323;
 --ok:#1f8a4c;--warn:#b86e00;--code:#ffffffa0;--bubble-l:91%;--select:#e2e9fb;--console:#15181e;--console-text:#d7dbe2}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--panel:#1c1f26;--line:#2d323c;--text:#e3e6ec;--muted:#9aa2b1;
 --accent:#7ea3ff;--danger:#ff7b7b;--ok:#5fd08e;--warn:#f0b450;--code:#00000050;--bubble-l:24%;--select:#26304a;
 --console:#0e1014;--console-text:#d7dbe2}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;display:grid;
 grid-template-columns:var(--side,272px) minmax(0,1fr) auto;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--accent)}
.link{background:none;border:0;color:var(--accent);padding:2px 4px}
.icon{background:none;border:0;padding:2px 6px;color:var(--muted);border-radius:4px}
.icon:hover{color:var(--text);background:var(--select)}
/* sidebar */
#side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
#side h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 14px 6px;display:flex;align-items:center;justify-content:space-between}
#newThread{display:flex;gap:6px;margin:0 12px 8px}#newThread input{flex:1;min-width:0;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.node{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;margin:1px 6px;border-radius:6px;cursor:pointer}
.node:hover{background:var(--select)}.node.selected{background:var(--select);font-weight:600}
.node .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.closed .name{color:var(--muted);font-weight:normal}
.caret{width:20px;text-align:center;color:var(--muted);background:none;border:0;padding:0}
.badge{font-size:11px;padding:0 6px;border-radius:8px;background:var(--line);color:var(--muted);white-space:nowrap;font-weight:normal}
.badge.you{background:var(--accent);color:#fff}
.children{margin:0 6px 6px 30px;border-left:1px solid var(--line);padding-left:4px}
.agent{display:grid;grid-template-columns:12px 1fr auto;gap:2px 6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.agent:hover{background:var(--select)}.agent.viewing{outline:1px solid var(--accent)}
.agent .sub{grid-column:2/4;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent .acts{display:flex;opacity:.55}.agent:hover .acts{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.running{background:var(--ok);animation:pulse 1.2s infinite}.dot.backoff{background:var(--warn)}.dot.stalled{background:var(--danger)}
.dot.idle{background:var(--muted)}.dot.floor{box-shadow:0 0 0 2px var(--accent)}
@keyframes pulse{50%{opacity:.35}}
/* chat */
#chat{display:flex;flex-direction:column;min-width:0;height:100vh}
#chat>header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#chat>header h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
.chip{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chip button{padding:0 8px;font-size:12px}
#messages{flex:1;overflow:auto;padding:8px 16px 24px}
#empty{color:var(--muted);text-align:center;margin-top:20vh}
.bubble{width:fit-content;max-width:min(90%,820px);margin:14px 0;padding:12px 16px;border-radius:14px;overflow-wrap:anywhere;
 background:hsl(var(--hue,215) 55% var(--bubble-l))}
.bubble.owner{margin-left:auto;--hue:150}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.bubble p{margin:6px 0}pre{overflow:auto;background:var(--code);padding:10px;border-radius:6px}code{font-family:ui-monospace,monospace;font-size:.92em;white-space:pre-wrap}pre code{white-space:pre}
.table{max-width:100%;overflow-x:auto}table{border-collapse:collapse}th,td{border:1px solid var(--line);padding:5px 9px;white-space:pre-wrap;min-width:80px}
details.held{margin:12px 0;padding:10px;border:1px dashed var(--muted);border-radius:10px}summary{cursor:pointer;color:var(--muted)}
.activity{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;width:fit-content;max-width:100%}
.activity .err{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
#composer{border-top:1px solid var(--line);padding:10px 16px;background:var(--bg)}
#composer textarea{display:block;width:100%;resize:vertical;min-height:72px;max-height:45vh;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.controls{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.controls select{padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);max-width:100%}
.send{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{color:var(--muted);font-size:12px}
.error{color:var(--danger)}
/* console */
#console{width:var(--console-w,440px);max-width:70vw;height:100vh;display:flex;flex-direction:column;background:var(--console);color:var(--console-text);position:relative;border-left:1px solid var(--line)}
#console[hidden]{display:none}
#resizer{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}
#console header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #2a2f39;font-size:13px}
#console header strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#console select,#console button{background:#232832;color:var(--console-text);border:1px solid #3a404c;border-radius:5px;padding:2px 6px;font-size:12px}
#console label{display:flex;gap:4px;align-items:center;font-size:12px}
#lines{flex:1;overflow:auto;padding:8px 12px;font:12.5px/1.45 ui-monospace,monospace}
.l{white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0}
.l.text{font-family:system-ui,sans-serif;font-size:13.5px;color:#fff;margin:8px 0}
.l.think{color:#8f97a6;font-style:italic}.l.tool{color:#8ab4ff}.l.tool::before{content:'▶ '}
.l.output{color:#a9b0bc;border-left:2px solid #333a46;padding-left:8px}.l.info{color:#7d8592}.l.error{color:#ff8b8b}.l.raw{color:#b9c0cc}
.l summary{color:#7d8592}
#lines .none{color:#7d8592}
/* dialogs and toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:18px 20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:#0007}
dialog h3{margin:0 0 12px;font-size:16px}
dialog label{display:block;margin:10px 0;font-size:13px;color:var(--muted)}
dialog input,dialog select{display:block;width:100%;margin-top:3px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:14px 0 0}
#toast{position:fixed;left:16px;bottom:16px;max-width:360px;padding:8px 12px;border-radius:8px;background:var(--danger);color:#fff;font-size:13px;z-index:10}
#toast[hidden]{display:none}
@media (max-width:820px){
 body{grid-template-columns:minmax(0,1fr)}
 #side{position:fixed;inset:0 auto 0 0;width:min(300px,85vw);z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 24px #0005}
 body.nav #side{transform:none}
 #menu{display:inline-block}
 #console{position:fixed;inset:0;width:auto;max-width:none;z-index:6}
 #resizer{display:none}
 #messages,#composer,#chat>header{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<nav id="side" aria-label="Dialogues and agents">
 <h2>Dialogues <button class="icon" id="addThread" title="New dialogue" aria-label="New dialogue">＋</button></h2>
 <form id="newThread" hidden><input name="thread" placeholder="new-dialogue-name" pattern="[a-z0-9][a-z0-9-]{0,63}" required aria-label="Dialogue name"><button>Create</button></form>
 <div id="tree"></div>
</nav>
<section id="chat">
 <header>
  <button class="icon" id="menu" aria-label="Dialogues">☰</button>
  <h1 id="title">Dialogue</h1>
  <span id="waiting" class="hint"></span>
  <span id="auto"></span>
 </header>
 <main id="messages"><p id="empty">Choose or create a dialogue on the left.</p></main>
 <form id="composer" hidden>
  <textarea id="body" aria-label="Message" placeholder="Write a message… (Ctrl+Enter sends)"></textarea>
  <div class="controls">
   <label>Who answers <select id="next"></select></label>
   <button class="send">Send</button>
   <span id="error" class="error" role="alert"></span>
  </div>
 </form>
</section>
<aside id="console" hidden aria-label="Agent console">
 <div id="resizer" title="Drag to resize"></div>
 <header>
  <strong id="consoleTitle"></strong>
  <select id="consoleLog" aria-label="Turn"></select>
  <label><input type="checkbox" id="follow" checked> follow</label>
  <button id="consoleClose" aria-label="Close console">✕</button>
 </header>
 <div id="lines"></div>
</aside>
<dialog id="connect">
 <form id="connectForm" method="dialog">
  <h3>Connect an agent to <span id="connectThread"></span></h3>
  <p id="noRunners" class="error" hidden>No runners configured: copy dialogue/runners.example.json to dialogue/runners.json and check its commands.</p>
  <label>Name in the dialogue <input name="agent" required pattern="[a-z][a-z0-9]{0,15}" placeholder="claude, astra, critic…"></label>
  <label>CLI <select name="runner"></select></label>
  <label>Model <select name="model"></select></label>
  <label>Effort <select name="effort"></select></label>
  <label>Memory between turns <select name="mode">
   <option value="resume">resume: keeps its own context (pays for it each turn)</option>
   <option value="fresh">fresh: new session each turn, reads NOTES.md and HANDOVER.md</option></select></label>
  <label>Continue an existing session (optional) <input name="session" placeholder="session UUID" pattern="[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"></label>
  <label>Turn timeout, minutes <input name="turn_timeout" type="number" min="1" max="600" value="60"></label>
  <p class="hint">Close that session in every terminal first: a session accepts one writer at a time.</p>
  <p id="connectError" class="error" role="alert"></p>
  <menu><button type="button" id="connectCancel">Cancel</button><button class="send" id="connectOk">Connect</button></menu>
 </form>
</dialog>
<div id="toast" role="alert" hidden></div>
<script>
const $ = s => document.querySelector(s);
function el(tag, props, ...children) {
  const node = Object.assign(document.createElement(tag), props || {});
  for (const child of children) if (child != null && child !== false) node.append(child);
  return node;
}
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
async function api(url, data) {
  const response = await fetch(url, data === undefined ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
  const result = await response.json();
  if (!response.ok) throw Error(result.error || response.statusText);
  return result;
}
let toastTimer;
function toast(message) {
  const box = $('#toast'); box.textContent = message; box.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => box.hidden = true, 6000);
}
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
const minutes = t => Math.max(0, Math.floor((Date.now() / 1000 - t) / 60)) + ' min';
const app = {thread: decodeURIComponent(location.hash.slice(1)) || null, threads: [], runners: {}, data: null,
  expanded: load('dialogue.expanded', {}), console: null, signature: '', consoleSignature: '', busy: false};

function hue(thread, author) {
  const names = (thread && thread.participants) || [];
  return [215, 28, 280, 175, 340, 95, 250, 55][Math.max(0, names.indexOf(author)) % 8];
}
function agentStatus(a) {
  if (a.state === 'running') return 'working · ' + minutes(a.since);
  if (a.state === 'backoff') return 'retry at ' + clock(a.next_try);
  if (a.state === 'stalled') return 'stalled';
  if (a.state === 'off') return a.in_dialogue ? 'interactive (no command)' : 'removed';
  return a.on_floor ? 'next to speak' : 'idle';
}
function select(name) {
  app.thread = name; app.signature = ''; location.hash = encodeURIComponent(name);
  document.body.classList.remove('nav');
  render(); refreshThread();
}
function openConsole(thread, agent) {
  if (thread !== app.thread) select(thread);
  app.console = {thread, agent, log: null}; app.consoleSignature = '';
  $('#console').hidden = false; $('#follow').checked = true; renderTree(); refreshConsole();
}

/* sidebar tree: dialogues, then the agents of each dialogue */
function renderTree() {
  const tree = $('#tree'); tree.replaceChildren();
  const threads = [...app.threads].sort((a, b) => (a.closed - b.closed) || String(b.last).localeCompare(String(a.last)));
  for (const t of threads) {
    const open = app.expanded[t.name] ?? (t.name === app.thread);
    const agents = Object.entries(t.dispatch.agents).filter(([, a]) => a.in_dialogue || a.state !== 'off');
    const working = agents.filter(([, a]) => a.state === 'running').length;
    const badge = t.closed ? el('span', {className: 'badge', textContent: 'closed'}) :
      t.floor.includes('owner') ? el('span', {className: 'badge you', textContent: 'your turn'}) :
      working ? el('span', {className: 'badge', textContent: working + ' working'}) : null;
    const caret = el('button', {className: 'caret', textContent: open ? '▾' : '▸', type: 'button',
      ariaLabel: open ? 'Collapse' : 'Expand', onclick: e => { e.stopPropagation(); app.expanded[t.name] = !open; store('dialogue.expanded', app.expanded); renderTree(); }});
    tree.append(el('div', {className: 'node' + (t.name === app.thread ? ' selected' : '') + (t.closed ? ' closed' : ''),
      title: t.name, onclick: () => select(t.name)}, caret, el('span', {className: 'name', textContent: t.name}), badge));
    if (!open) continue;
    const children = el('div', {className: 'children'});
    for (const [name, a] of agents) children.append(agentRow(t, name, a));
    if (!t.closed) children.append(el('button', {className: 'link', type: 'button', textContent: '＋ connect agent', onclick: () => openConnect(t.name)}));
    tree.append(children);
  }
}
function agentRow(t, name, a) {
  const viewing = app.console && app.console.thread === t.name && app.console.agent === name;
  const sub = [a.model, a.effort, a.mode === 'fresh' ? 'fresh' : null].filter(Boolean).join(' · ') || a.runner || '';
  const acts = el('span', {className: 'acts'});
  if (a.on_floor && a.state !== 'running' && a.state !== 'off' && !t.closed)
    acts.append(el('button', {className: 'icon', textContent: '⏵', title: 'Wake now', type: 'button',
      onclick: e => { e.stopPropagation(); act('/wake', {thread: t.name, name}); }}));
  if (a.runner && a.runner !== 'custom' && !t.closed)
    acts.append(el('button', {className: 'icon', textContent: '⚙', title: 'Change model or effort', type: 'button',
      onclick: e => { e.stopPropagation(); openConnect(t.name, name, a); }}));
  if (a.in_dialogue && !t.closed)
    acts.append(el('button', {className: 'icon', textContent: '✕', title: 'Remove from the dialogue', type: 'button',
      onclick: e => { e.stopPropagation(); if (confirm('Remove ' + name + ' from ' + t.name + '? Its messages stay.')) act('/disconnect', {thread: t.name, name}); }}));
  return el('div', {className: 'agent' + (viewing ? ' viewing' : ''), title: (a.error || 'Open console'),
      onclick: () => openConsole(t.name, name)},
    el('span', {className: 'dot ' + a.state + (a.on_floor ? ' floor' : '')}),
    el('span', {textContent: name + ' — ' + agentStatus(a)}), acts,
    el('span', {className: 'sub', textContent: sub}));
}
async function act(url, data) {
  try { await api(url, data); app.signature = ''; await refreshAll(); } catch (e) { toast(e.message); }
}

/* chat column */
function render() {
  const s = app.data, has = !!(s && app.thread);
  $('#composer').hidden = !has;
  $('#title').textContent = app.thread || 'Dialogue';
  if (!has) { $('#messages').replaceChildren(el('p', {id: 'empty', textContent: app.threads.length ? 'Choose a dialogue on the left.' : 'Create a dialogue with ＋ on the left.'})); $('#waiting').textContent = ''; $('#auto').replaceChildren(); return; }
  const d = s.dispatch;
  $('#waiting').textContent = s.closed ? 'closed' : 'waiting for: ' + (s.floor.join(', ') || 'nobody (paused)');
  const auto = $('#auto'); auto.replaceChildren();
  if (d.auto !== 'off' && !s.closed) auto.append(el('span', {className: 'chip', textContent: 'auto ' + d.auto + ' · ' + d.turns + '/' + d.max_auto_turns},
    el('button', {type: 'button', textContent: d.auto === 'on' ? 'pause' : 'resume', onclick: () => act(d.auto === 'on' ? '/pause' : '/resume', {thread: app.thread})})));
  const box = $('#messages'), bottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 80;
  const expanded = new Set([...box.querySelectorAll('details[open]')].map(x => x.dataset.author));
  box.replaceChildren();
  const config = s.config;
  for (const m of s.messages) box.append(bubble(config, m));
  for (const m of s.held) {
    const others = s.parallel.filter(x => x !== m.author).join(', ');
    const d2 = el('details', {className: 'held', open: expanded.has(m.author)}, el('summary', {textContent: m.author + ' has answered; hidden until ' + (others || 'the others') + ' answer'}), bubble(config, m));
    d2.dataset.author = m.author; box.append(d2);
  }
  for (const [name, a] of Object.entries(d.agents)) {
    if (!['running', 'backoff', 'stalled'].includes(a.state)) continue;
    const text = a.state === 'running' ? name + ' is working · ' + minutes(a.since) :
      a.state === 'backoff' ? name + ': attempt ' + a.attempt + ' failed, next try at ' + clock(a.next_try) : name + ' is stalled after ' + a.attempt + ' attempts';
    box.append(el('div', {className: 'activity'}, el('span', {className: 'dot ' + a.state}), el('span', {textContent: text}),
      el('button', {type: 'button', textContent: 'console', onclick: () => openConsole(app.thread, name)}),
      a.state !== 'running' ? el('button', {type: 'button', textContent: 'wake now', onclick: () => act('/wake', {thread: app.thread, name})}) : null,
      a.error && a.state !== 'running' ? el('div', {className: 'err', textContent: a.error}) : null));
  }
  if (!s.messages.length && !s.held.length) box.append(el('p', {id: 'empty', textContent: 'No messages yet. Connect agents on the left, then write the opening message.'}));
  if (bottom) box.scrollTop = box.scrollHeight;
  renderNext(s);
  $('#body').disabled = s.closed; $('#composer .send').disabled = s.closed;
}
function bubble(config, m) {
  const b = el('article', {className: 'bubble ' + m.author});
  b.style.setProperty('--hue', m.author === 'owner' ? 150 : hue(config, m.author));
  b.append(el('div', {className: 'meta', textContent: ['#' + m.n, m.author, '→ ' + m.next, m.round, (m.time || '').replace('T', ' ')].filter(Boolean).join(' · ')}));
  const content = el('div'); content.innerHTML = m.html; b.append(content);
  return b;
}
function renderNext(s) {
  const next = $('#next'), selected = next.value;
  const labels = {keep: 'nobody new (interjection, the floor stays)', all: 'all agents, in parallel (answers sealed)',
    pause: 'nobody (pause)', close: 'nobody (close the dialogue)'};
  const values = (s.floor.some(x => x !== 'owner') ? ['keep'] : []).concat(s.agents.length > 1 ? ['all'] : [], s.agents, ['pause', 'close']);
  next.replaceChildren();
  if (!values.includes(selected) && !values.includes('keep')) next.append(el('option', {value: '', textContent: 'Choose who answers', disabled: true, selected: true}));
  for (const v of values) next.append(el('option', {value: v, textContent: labels[v] || v}));
  if (values.includes(selected)) next.value = selected; else if (values.includes('keep')) next.value = 'keep';
}
$('#composer').addEventListener('submit', async e => {
  e.preventDefault(); if (app.busy) return;
  const error = $('#error');
  if (!$('#next').value) { error.textContent = 'Choose who answers'; return; }
  app.busy = true; error.textContent = '';
  try { await api('/post', {thread: app.thread, body: $('#body').value, next: $('#next').value}); $('#body').value = ''; $('#next').value = '';
    app.signature = ''; const box = $('#messages'); await refreshAll(); box.scrollTop = box.scrollHeight; }
  catch (e2) { error.textContent = e2.message; } finally { app.busy = false; }
});
$('#body').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#composer').requestSubmit(); } });

/* console panel */
async function refreshConsole() {
  const c = app.console; if (!c || $('#console').hidden) return;
  const query = '/console?thread=' + encodeURIComponent(c.thread) + '&agent=' + encodeURIComponent(c.agent) + (c.log ? '&log=' + encodeURIComponent(c.log) : '');
  let data;
  try { data = await api(query); } catch (e) { $('#lines').replaceChildren(el('div', {className: 'none', textContent: e.message})); return; }
  if (app.console !== c) return;
  $('#consoleTitle').textContent = c.agent + ' · ' + c.thread;
  const pick = $('#consoleLog'); pick.replaceChildren();
  for (const name of [...data.logs].reverse()) {
    const [, turn, attempt] = name.match(/wake-(\d+)-(\d+)/);
    pick.append(el('option', {value: name, textContent: 'after #' + turn + (attempt !== '1' ? ' · attempt ' + attempt : ''), selected: name === data.log}));
  }
  if (!data.logs.length) pick.append(el('option', {textContent: 'no turns yet'}));
  const signature = data.log + ':' + data.lines.length + ':' + JSON.stringify(data.lines.slice(-1));
  if (signature === app.consoleSignature) return;
  app.consoleSignature = signature;
  const lines = $('#lines'), opened = new Set([...lines.querySelectorAll('details[open]')].map(x => x.dataset.i));
  lines.replaceChildren();
  if (!data.lines.length) lines.append(el('div', {className: 'none', textContent: data.logs.length ? 'No output yet.' : 'This agent has not been started in this dialogue yet.'}));
  data.lines.forEach(([kind, text], i) => {
    const rows = text.split('\n');
    if ((kind === 'output' || kind === 'think') && rows.length > 6) {
      const d = el('details', {className: 'l ' + kind, open: opened.has(String(i))}, el('summary', {textContent: rows.slice(0, 2).join('\n') + '\n… ' + rows.length + ' lines'}), text);
      d.dataset.i = i; lines.append(d);
    } else lines.append(el('div', {className: 'l ' + kind, textContent: text}));
  });
  if ($('#follow').checked) lines.scrollTop = lines.scrollHeight;
}
$('#consoleLog').addEventListener('change', e => { app.console.log = e.target.value; app.consoleSignature = ''; $('#follow').checked = e.target.selectedIndex === 0; refreshConsole(); });
$('#consoleClose').addEventListener('click', () => { $('#console').hidden = true; app.console = null; renderTree(); });
$('#lines').addEventListener('scroll', e => { const x = e.target; $('#follow').checked = x.scrollTop + x.clientHeight >= x.scrollHeight - 30; });
$('#resizer').addEventListener('pointerdown', e => {
  e.preventDefault(); const target = e.target; target.setPointerCapture(e.pointerId);
  const move = m => { const width = Math.min(window.innerWidth * 0.7, Math.max(260, window.innerWidth - m.clientX)); document.body.style.setProperty('--console-w', width + 'px'); };
  const up = () => { target.removeEventListener('pointermove', move); store('dialogue.consoleWidth', getComputedStyle(document.body).getPropertyValue('--console-w')); };
  target.addEventListener('pointermove', move); target.addEventListener('pointerup', up, {once: true});
});
{ const width = load('dialogue.consoleWidth', null); if (width) document.body.style.setProperty('--console-w', width); }

/* connect dialog and new dialogue */
function fill(selectNode, values, chosen) {
  selectNode.replaceChildren(...values.map(v => el('option', {value: v, textContent: v})));
  if (values.includes(chosen)) selectNode.value = chosen;
}
function openConnect(thread, name, agent) {
  const form = $('#connectForm'), names = Object.keys(app.runners);
  $('#connectThread').textContent = thread; $('#connectError').textContent = '';
  $('#noRunners').hidden = names.length > 0; $('#connectOk').disabled = !names.length;
  form.agent.value = name || ''; form.agent.readOnly = !!name;
  fill(form.runner, names, agent && agent.runner);
  const sync = () => { const r = app.runners[form.runner.value] || {models: [], efforts: []};
    fill(form.model, r.models, agent && agent.model); fill(form.effort, r.efforts, agent && agent.effort); };
  form.runner.onchange = () => { agent = null; sync(); };
  sync();
  form.mode.value = (agent && agent.mode) || 'resume'; form.session.value = (agent && agent.session) || '';
  form.dataset.thread = thread; $('#connect').showModal();
}
$('#connectCancel').addEventListener('click', () => $('#connect').close());
$('#connectForm').addEventListener('submit', async e => {
  e.preventDefault(); const form = e.target;
  try {
    await api('/connect', {thread: form.dataset.thread, name: form.agent.value, runner: form.runner.value, model: form.model.value,
      effort: form.effort.value, mode: form.mode.value, session: form.session.value || null, turn_timeout: Number(form.turn_timeout.value)});
    app.expanded[form.dataset.thread] = true; store('dialogue.expanded', app.expanded);
    $('#connect').close(); app.signature = ''; await refreshAll();
  } catch (e2) { $('#connectError').textContent = e2.message; }
});
$('#addThread').addEventListener('click', () => { const f = $('#newThread'); f.hidden = !f.hidden; if (!f.hidden) f.thread.focus(); });
$('#newThread').addEventListener('submit', async e => {
  e.preventDefault(); const name = e.target.thread.value;
  try { await api('/new', {thread: name}); e.target.hidden = true; e.target.reset(); await refreshAll(); select(name); openConnect(name); }
  catch (e2) { toast(e2.message); }
});
$('#menu').addEventListener('click', () => document.body.classList.toggle('nav'));

/* polling */
async function refreshThreads() {
  try { const data = await api('/threads'); app.threads = data.threads; app.runners = data.runners; renderTree(); }
  catch (e) { toast('Cannot reach the chat server: ' + e.message); }
}
async function refreshThread() {
  if (!app.thread) { app.data = null; render(); return; }
  const name = app.thread;
  try {
    const data = await api('/messages?thread=' + encodeURIComponent(name));
    if (name !== app.thread) return;
    const signature = JSON.stringify(data) + Math.floor(Date.now() / 60000);
    if (signature === app.signature) return;
    app.signature = signature; app.data = data; render();
  } catch (e) { app.data = null; render(); toast(e.message); }
}
async function refreshAll() { await refreshThreads(); await refreshThread(); await refreshConsole(); }
window.addEventListener('hashchange', () => { const name = decodeURIComponent(location.hash.slice(1)); if (name && name !== app.thread) select(name); });
refreshAll(); setInterval(refreshAll, 2000);
</script>
