# Evidence-base check: every push / PR touching the research must keep verification/verify_all.py green.
name: verify
on:
  push:
    paths: ["research/12-faced-polyhedron/**", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["research/12-faced-polyhedron/**", ".github/workflows/verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/12-faced-polyhedron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: research/12-faced-polyhedron/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python verification/verify_all.py
